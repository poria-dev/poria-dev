
name: generate pacman game

on:
  schedule:
    - cron: "0 */24 * * *"   # هر ۲۴ ساعت
  workflow_dispatch:         # دستی اجرا کن
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write        # حتماً این رو داشته باش
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: poria-dev   # فقط این ورودی رو نگه دار

      - name: Push generated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
